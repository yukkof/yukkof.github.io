<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}} — {{SITE_NAME}}</title>
<meta name="description" content="{{APP_TAGLINE}}">
<meta name="theme-color" content="#08090a">
<meta property="og:type" content="website">
<meta property="og:title" content="{{NAME}} — {{SITE_NAME}}">
<meta property="og:description" content="{{APP_TAGLINE}}">
<meta property="og:image" content="{{ASSETS}}assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ASSETS}}assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ASSETS}}assets/site.css">
</head>
<body>

<div class="nav-shell">
  <nav class="nav">
    <a class="brand" href="{{ASSETS}}index.html">
      <span class="mark">{{BRAND_LETTER}}</span><span data-zh="{{SITE_NAME}}" data-en="{{SITE_NAME_EN}}">{{SITE_NAME}}</span>
    </a>
    <div class="nav-links">{{NAV_LINKS}}</div>
    <span class="nav-spacer"></span>
    <div class="lang-switch" id="lang-switch">
      <button type="button" data-lang="zh" aria-pressed="true">中</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换主题"></button>
  </nav>
</div>

<main class="wrap detail">

  <a class="back" href="{{ASSETS}}index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    <span data-i18n="back">全部软件</span>
  </a>

  <header class="detail-head">
    {{ICON}}
    <div class="detail-title">
      <h1 data-zh="{{NAME}}" data-en="{{NAME_EN}}">{{NAME}}</h1>
      <p class="detail-tagline" data-zh="{{APP_TAGLINE}}" data-en="{{APP_TAGLINE_EN}}">{{APP_TAGLINE}}</p>
      <div class="pills">{{PILLS}}</div>
    </div>
  </header>

  <div class="detail-body">
    <div class="main-col">
      <section>
        <h2 class="sec" data-i18n="about">介绍</h2>
        <p class="prose" data-zh="{{DESCRIPTION}}" data-en="{{DESCRIPTION_EN}}">{{DESCRIPTION}}</p>
      </section>
      {{FEATURES}}
      {{SHOTS}}
      {{CHANGELOG}}
    </div>

    <aside class="side">
      {{DL}}
      <div class="spec-card">{{SPEC}}</div>
    </aside>
  </div>

</main>

<footer class="footer">
  <div class="wrap">
    <div class="footer-inner">
      <div>
        <div class="footer-brand" data-zh="{{SITE_NAME}}" data-en="{{SITE_NAME_EN}}">{{SITE_NAME}}</div>
        <div class="footer-note" data-zh="{{COPYRIGHT}}" data-en="{{COPYRIGHT_EN}}">{{COPYRIGHT}}</div>
      </div>
      <div class="footer-links">{{FOOTER_LINKS}}</div>
    </div>
  </div>
</footer>

<script src="{{ASSETS}}assets/site.js"></script>
</body>
</html>
